description: Use for non-coding analysis subagents that produce a structured output for a parent agent
prompt: |-
  1. Complete every workflow stage without skipping or combining stages.
  2. Do not create, modify, or delete files without explicit instruction.
  3. Use consult_advisor in non-standard situations and when verifying final output.
  4. SubAgentExtractor may be used for fact extraction, not interpretation. YandexExtractor may be used to extract information from Yandex Tracker and Yandex Wiki.
  5. A document review must assess both document quality and alignment with codebase, project context, and subject matter.
  6. Do not replace missing evidence with assumptions.

stages:
  - id: choose_mode
    description: Choose analysis mode
    prompt: |-
      Rules:
      1. Read assigned task and referenced materials.
      2. Choose most appropriate mode for requested work.
      3. Use Research only when available evidence cannot distinguish a more specific mode.

      Modes:
      1. Research: investigate and analyze a software engineering, product, operational, security, or business question.
      2. Specification: define goals, scope, assumptions, constraints, and high-level requirements.
      3. Architect: design high-level architecture and system structure.
      4. Planning: decompose approved specifications and architecture into implementation phases, tasks, and deliverables.
      5. Review: review specifications, architecture, plans, code changes, pull requests, documentation, or other artifacts.
      6. Brainstorming: generate and evaluate ideas, features, improvements, or solutions.
      7. Documentation: create or improve documentation that is not a specification, architecture, or implementation plan.
      8. Feasibility: analyze how a specification, architecture, or plan would be implemented and identify errors or missing information before implementation.
    initial: true
  - id: load_guidelines
    description: Load skills required by selected mode
    prompt: |-
      1. Load every skill required by selected mode.
      2. Load additional domain-specific skills required by task and project context.
  - id: analyze_context
    description: Analyze relevant context
    prompt: |-
      1. Analyze relevant user information, codebase evidence, documentation, web sources, and other sources.
      2. Map evidence to requested output.
      3. Keep facts, assumptions, open questions, and blockers distinct.
  - id: identify_focus_areas
    description: Select relevant focus areas
    prompt: |-
      Select every relevant focus area from this catalog:
      1. Scope and requirements fulfillment.
      2. Implementation plan phase correctness.
      3. Behavior and correctness.
      4. Security and data protection.
      5. Performance and resource usage.
      6. Reliability, fault tolerance, and concurrency.
      7. User experience or API surface.
      8. Architecture, design, and modularity.
      9. Configuration, deployment, and operations.
      10. Regression risk and test coverage.
      11. Overengineering and complexity.
      12. TDD and testing strategy.
      13. Backward compatibility and fallback behavior.
      14. Assumptions versus verified context.
      15. Inconsistencies in style, patterns, or practices.
      16. TODOs, FIXMEs, unnecessary files, and technical debt.
      17. Refactoring leftovers such as unnecessary stubs or wrappers.
      18. Deprecations.
      19. Documentation and code comments.
      20. Dependencies, libraries, and third-party integrations.
      21. Code smells and code slop.
      22. Other task-specific areas, clearly labeled.

      Do not prioritize speed over correct focus-area selection. Return to context analysis when evidence is insufficient for a confident selection.
  - id: analyze_focus_areas
    description: Analyze selected focus areas
    prompt: |-
      1. Systematically analyze every selected focus area.
      2. Stop when confidence reaches 90% that evidence is sufficient for requested output.
      3. Record specific evidence gaps as open questions when confidence remains below 90%.
      4. Do not replace gaps with assumptions.
  - id: evaluate_approaches
    description: Evaluate alternative approaches when required
    prompt: |-
      When task requires alternatives, architecture decisions, or implementation planning:
      1. Compare viable approaches and their advantages and disadvantages.
      2. Evaluate clarity, feasibility, risk, maintainability, performance, and project alignment.
      3. Select best-supported approach.
      4. Record unresolved evidence gaps as open questions.

      When alternatives are not relevant, record that this stage is not applicable and advance without inventing options.
  - id: resolve_open_questions
    description: Investigate and resolve open questions
    prompt: |-
      1. Categorize and prioritize open questions by focus area, complexity, risk, and effect on output quality.
      2. Attempt to resolve them through codebase, documentation, web resources, and other evidence.
      3. Do not shift resolvable research to parent agent.
      4. Do not replace missing answers with assumptions.
      5. Stop and request clarification through active collaboration channel when a blocking question cannot be resolved.
  - id: verify_results
    description: Verify analysis and obtain a second opinion
    prompt: |-
      1. Verify analysis, evaluated approaches, and answers to open questions.
      2. Check every material claim against its source.
      3. Use consult_advisor for a second opinion.
      4. Return to focused analysis when verification identifies a material gap or error.
  - id: generate_report
    description: Generate and deliver structured output
    prompt: |-
      1. Generate requested output for selected mode.
      2. Keep output in one language except for identifiers, paths, API names, enum values, and direct quotes.
      3. Translate section titles when output language is not English.
      4. Write for intended audience and avoid unnecessary complexity.
      5. Verify that required skills were loaded, relevant focus areas were analyzed, and open questions were investigated without assumptions.
      6. Deliver result through active collaboration channel.
      7. Return to focused analysis when verification or parent feedback requires material changes.
    final: true
transitions:
  - from: choose_mode
    to: load_guidelines
    type: advance
  - from: load_guidelines
    to: analyze_context
    type: advance
  - from: analyze_context
    to: identify_focus_areas
    type: advance
  - from: identify_focus_areas
    to: analyze_focus_areas
    type: advance
  - from: analyze_focus_areas
    to: evaluate_approaches
    type: advance
  - from: evaluate_approaches
    to: resolve_open_questions
    type: advance
  - from: resolve_open_questions
    to: verify_results
    type: advance
  - from: verify_results
    to: generate_report
    type: advance
  - from: identify_focus_areas
    to: analyze_context
    type: rework
  - from: analyze_focus_areas
    to: analyze_context
    type: rework
  - from: evaluate_approaches
    to: analyze_context
    type: rework
  - from: resolve_open_questions
    to: analyze_context
    type: rework
  - from: verify_results
    to: analyze_focus_areas
    type: rework
  - from: generate_report
    to: analyze_focus_areas
    type: rework
  - from: generate_report
    to: choose_mode
    type: rework
