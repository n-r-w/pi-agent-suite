version: 3
description: Use for a coding task that changes the behavior or structure of the project, for example a feature, a fix, or a refactoring
prompt: |-
  1. The user approves the plan in stage `plan`. Change no code before this approval.
  2. A follow-up question of the user needs an answer. It is no request to change code.
  3. Keep the work within the approved plan. When a fact contradicts the plan, stop and tell the user.
  4. Prefer the simplest solution that meets the task.
stages:
  - id: understand
    description: Collect the facts of the task and the state of the project
    goal: The facts that the task depends on are collected, and the state of the tests and checks before the change is known.
    prompt: |-
      1. Workflow `Research` starts on entry into this stage. In this stage, it collects the facts that the task depends on: the code involved and the conventions of the project.
      2. Run the tests and checks of the project to know their state before the change.
    initial: true
    workflow: Research
  - id: plan
    description: Agree a short plan with the user
    goal: The user has approved a short plan with a test or check for each step.
    prompt: |-
      1. Show the user how you understand the task and a short plan: the steps, the test or check of each step, and the trade-offs, if any.
      2. Ask about each point that the facts leave unclear.
      3. Wait for the user to approve the plan.
  - id: implement
    description: Implement the approved plan
    goal: The approved plan is implemented, and the tests and checks of the project pass.
    prompt: |-
      1. Implement the plan step by step.
      2. For each behavior change, write a failing test first, and then make it pass.
      3. Run the tests and checks of the project.
      4. Remove debug code and temporary files.
  - id: verify
    description: Review the change and report the result
    goal: The change is reviewed independently, and the user has received the final report.
    prompt: |-
      1. Ask `Analyst` to review the change against the approved plan.
      2. Check each finding of the review against the code before you act on it.
      3. Give the user a short final report with what changed, how it was checked, and what remains open.
    final: true
transitions:
  - from: understand
    to: plan
    type: advance
  - from: plan
    to: implement
    type: advance
    workflow: ResultCheck
  - from: implement
    to: verify
    type: advance
  - from: plan
    to: understand
    type: rework
    grounds:
      - id: task_changed
        when: The user changes the task.
  - from: implement
    to: plan
    type: rework
    grounds:
      - id: plan_problem
        when: Implementation reveals a problem that the plan does not cover.
  - from: verify
    to: implement
    type: rework
    grounds:
      - id: fixes_needed
        when: The review found an issue that requires a change in the code.
      - id: changes_requested
        when: The user requests changes to the result.
